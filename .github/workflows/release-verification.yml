name: EGit release verification

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JGIT_COMMIT: 4ceb7bf5407477a7d6c34933af1120a7f838d36d
  REPORT_VALIDATOR_COMMIT: 1202ab304c3b81b73b628d201b987941d16c94d2
  # Tycho 5.0.4 (egit and the pinned JGit) injects nested Bundle-ClassPath jars as
  # system dependencies whose classifier contains '/'. Maven 3.10.x (Resolver 2.x,
  # the ubuntu-24.04 image default) rejects them with "Invalid Collect Request",
  # which broke cyclonedx:makeAggregateBom on org.eclipse.egit.ui.test
  # (eclipse-tycho/tycho#6399, not yet in a Tycho release). Build with the
  # latest Maven 3.9.x until tycho-version contains that fix.
  MAVEN_VERSION: 3.9.16
  MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out EGit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: egit
          persist-credentials: false
      - name: Check out the matching JGit 8 dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: eclipse-jgit/jgit
          ref: ${{ env.JGIT_COMMIT }}
          path: jgit
          persist-credentials: false
      - name: Check out the shared test report validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hsoliwal/eclipse.platform.swt
          ref: ${{ env.REPORT_VALIDATOR_COMMIT }}
          path: release-validator
          sparse-checkout: tools/release/readiness.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            egit/**/pom.xml
            jgit/**/pom.xml
      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          echo "$MAVEN_SHA512  $archive" | sha512sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin/mvn" --version
      - name: Record exact source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C egit rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C jgit rev-parse HEAD)" = "$JGIT_COMMIT"
          test "$(git -C release-validator rev-parse HEAD)" = "$REPORT_VALIDATOR_COMMIT"
          mkdir -p "$RUNNER_TEMP/egit-source-inputs"
          git -C egit rev-parse HEAD > "$RUNNER_TEMP/egit-source-inputs/EGIT_COMMIT"
          git -C egit rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/egit-source-inputs/EGIT_TREE"
          git -C jgit rev-parse HEAD > "$RUNNER_TEMP/egit-source-inputs/JGIT_COMMIT"
          git -C jgit rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/egit-source-inputs/JGIT_TREE"
          printf '%s\n' 'JGit is built as a pinned dependency; its own tests are not executed.' \
            > "$RUNNER_TEMP/egit-source-inputs/JGIT_TEST_SCOPE"
          git -C release-validator rev-parse HEAD > "$RUNNER_TEMP/egit-source-inputs/REPORT_VALIDATOR_COMMIT"
          sha256sum release-validator/tools/release/readiness.py \
            > "$RUNNER_TEMP/egit-source-inputs/REPORT_VALIDATOR_SHA256"
          mvn --version > "$RUNNER_TEMP/egit-source-inputs/MAVEN_VERSION"
          grep -F "Apache Maven $MAVEN_VERSION " "$RUNNER_TEMP/egit-source-inputs/MAVEN_VERSION"
          java -version 2> "$RUNNER_TEMP/egit-source-inputs/JAVA_VERSION"
      - name: Install GTK test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            xvfb xauth openbox dbus-x11 libgtk-3-0t64 libwebkit2gtk-4.1-0
      - name: Build the pinned JGit dependency
        working-directory: jgit
        run: mvn --batch-mode --no-transfer-progress clean install -DskipTests=true
      - name: Build the pinned JGit p2 repository
        working-directory: jgit/org.eclipse.jgit.packaging
        run: >-
          mvn --batch-mode --no-transfer-progress clean install
          -DskipTests=true -Dtycho.baseline.replace=none
      - name: Verify the complete EGit reactor
        working-directory: egit
        shell: bash
        run: |
          set -euo pipefail
          env -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE GDK_BACKEND=x11 \
            dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24' \
            bash -euo pipefail <<'VERIFY'
          openbox --sm-disable > "$RUNNER_TEMP/egit-window-manager.log" 2>&1 &
          window_manager_pid=$!
          trap 'kill "$window_manager_pid" 2>/dev/null || true' EXIT
          mvn --batch-mode --no-transfer-progress clean verify \
            "-Djgit-site=file:$GITHUB_WORKSPACE/jgit/org.eclipse.jgit.packaging/org.eclipse.jgit.repository/target/repository" \
            -Dtycho.baseline.replace=none -Dtycho.localArtifacts=ignore \
            -DskipTests=false -Dmaven.test.skip=false \
            -Dmaven.test.failure.ignore=false -DfailIfNoTests=true
          VERIFY
      - name: Require passing reports from every EGit test bundle
        working-directory: egit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util

          source = Path("../release-validator/tools/release/readiness.py")
          spec = importlib.util.spec_from_file_location("swt_readiness", source)
          readiness = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(readiness)
          seen_files = set()
          for module in (
              "org.eclipse.egit.core.test",
              "org.eclipse.egit.gitflow.test",
              "org.eclipse.egit.ui.test",
          ):
              report = readiness.junit_report(Path(module, "target/surefire-reports"), seen_files)
              executed = report["tests"] - report["skipped"]
              if report["failures"] or report["errors"] or executed <= 0:
                  raise SystemExit(f"Missing successful test execution for {module}: {report}")
              print(f"{module}: {executed} tests executed successfully")
          PY
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: egit-test-reports
          if-no-files-found: error
          path: egit/**/target/surefire-reports/
      - name: Retain source identities and UI diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: egit-release-source-inputs
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/egit-source-inputs/
            ${{ runner.temp }}/egit-window-manager.log
            egit/**/target/screenshots/
      - name: Retain the verified EGit repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: egit-repository
          if-no-files-found: error
          path: egit/org.eclipse.egit.repository/target/repository/
